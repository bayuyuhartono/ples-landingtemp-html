<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLES+ — Creative Agency</title>

  <!-- SEO -->
  <meta name="description" content="PLES+ is a creative agency delivering bold ideas and modern solutions." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://plescreative.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="assets/ples_logo.png" />

  <!-- Theme color -->
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PLES+" />
  <meta property="og:title" content="PLES+ — Creative Agency" />
  <meta property="og:description" content="PLES+ is a creative agency delivering bold ideas and modern solutions." />
  <meta property="og:url" content="https://plescreative.com/" />
  <meta property="og:image" content="https://plescreative.com/assets/ples_logo.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PLES+ — Creative Agency" />
  <meta name="twitter:description" content="PLES+ is a creative agency delivering bold ideas and modern solutions." />
  <meta name="twitter:image" content="https://plescreative.com/assets/ples_logo.png" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --fg: #f0f0f0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Noise texture overlay */
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9;
      animation: noiseShift 0.5s steps(1) infinite;
    }

    @keyframes noiseShift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-3%, -3%); }
      50%  { transform: translate(3%, 0); }
      75%  { transform: translate(0, 3%); }
      100% { transform: translate(-3%, 3%); }
    }

    /* Grid background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      z-index: 5;
    }
    .corner::before,
    .corner::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.4);
    }
    .corner::before { width: 2px; height: 100%; }
    .corner::after  { width: 100%; height: 2px; }

    .corner-tl { top: 24px; left: 24px; }
    .corner-tl::before { top: 0; left: 0; }
    .corner-tl::after  { top: 0; left: 0; }

    .corner-tr { top: 24px; right: 24px; }
    .corner-tr::before { top: 0; right: 0; }
    .corner-tr::after  { top: 0; right: 0; }

    .corner-bl { bottom: 24px; left: 24px; }
    .corner-bl::before { bottom: 0; left: 0; }
    .corner-bl::after  { bottom: 0; left: 0; }

    .corner-br { bottom: 24px; right: 24px; }
    .corner-br::before { bottom: 0; right: 0; }
    .corner-br::after  { bottom: 0; right: 0; }

    /* Status bar */
    .status-bar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      z-index: 6;
    }

    .status-bar span {
      animation: blink 2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Bottom label */
    .bottom-label {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.5em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
      z-index: 6;
      white-space: nowrap;
    }

    /* Main logo wrapper */
    .logo-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glitch-container {
      position: relative;
      display: inline-block;
    }

    .logo-main {
      display: block;
      width: clamp(240px, 50vw, 600px);
      height: auto;
      filter: invert(1);
      position: relative;
      z-index: 2;
      animation: logoBreath 6s ease-in-out infinite;
    }

    @keyframes logoBreath {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.95; transform: scale(1.01); }
    }

    /* Glitch pseudo-layers */
    .glitch-container::before,
    .glitch-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('assets/ples_logo.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      filter: invert(1);
      z-index: 3;
      opacity: 0;
    }

    .glitch-container::before {
      animation: glitchLayerR 5s infinite;
      mix-blend-mode: screen;
    }

    .glitch-container::after {
      animation: glitchLayerB 5s infinite 0.1s;
      mix-blend-mode: screen;
    }

    @keyframes glitchLayerR {
      0%,  48%, 100% { opacity: 0; transform: none; }

      49% {
        opacity: 0.7;
        transform: translate(-4px, 0) skewX(-1deg);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg);
        clip-path: polygon(0 15%, 100% 15%, 100% 30%, 0 30%);
      }
      50% {
        opacity: 0.8;
        transform: translate(5px, 0);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg);
        clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
      }
      51% {
        opacity: 0.6;
        transform: translate(-3px, 1px) skewX(2deg);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg);
        clip-path: polygon(0 40%, 100% 40%, 100% 55%, 0 55%);
      }
      52% { opacity: 0; }

      72% {
        opacity: 0.5;
        transform: translate(6px, 0);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg);
        clip-path: polygon(0 5%, 100% 5%, 100% 20%, 0 20%);
      }
      73% { opacity: 0; }
    }

    @keyframes glitchLayerB {
      0%, 48%, 100% { opacity: 0; transform: none; }

      49% {
        opacity: 0.7;
        transform: translate(4px, 0) skewX(1deg);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(180deg);
        clip-path: polygon(0 50%, 100% 50%, 100% 70%, 0 70%);
      }
      50% {
        opacity: 0.8;
        transform: translate(-5px, 0);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(180deg);
        clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
      }
      51% {
        opacity: 0.6;
        transform: translate(2px, -1px);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(180deg);
        clip-path: polygon(0 75%, 100% 75%, 100% 90%, 0 90%);
      }
      52% { opacity: 0; }

      74% {
        opacity: 0.5;
        transform: translate(-7px, 0);
        filter: invert(1) sepia(1) saturate(5) hue-rotate(180deg);
        clip-path: polygon(0 30%, 100% 30%, 100% 45%, 0 45%);
      }
      75% { opacity: 0; }
    }

    /* Horizontal scan line that sweeps across during glitch */
    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 4;
      animation: scanMove 5s linear infinite;
      pointer-events: none;
    }

    @keyframes scanMove {
      0%   { top: -2px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Whole-container random shake during glitch bursts */
    .glitch-container {
      animation: containerShake 5s infinite;
    }

    @keyframes containerShake {
      0%,  47%, 53%, 100% { transform: none; }
      48% { transform: translateX(-2px); }
      49% { transform: translateX(3px) skewX(-0.5deg); }
      50% { transform: translateX(-1px) skewX(0.5deg); }
      51% { transform: translateX(2px); }
      52% { transform: translateX(0); }
    }

    /* White flash on glitch trigger */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      animation: flashPop 5s infinite;
    }

    @keyframes flashPop {
      0%, 47.5%, 52.5%, 100% { opacity: 0; }
      48%  { opacity: 0.04; }
      48.5%{ opacity: 0; }
      49%  { opacity: 0.06; }
      49.5%{ opacity: 0; }
      50%  { opacity: 0.03; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="flash"></div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="logo-wrapper">
    <div class="glitch-container">
      <img class="logo-main" src="assets/ples_logo.png" alt="PLES+" />
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="bottom-label">ples+ &nbsp;·&nbsp; 2026</div>

</body>
</html>
